# Lean oracles: reference definitions of what parts of documenter mean, kept in
# `oracle/` folders beside the Rust modules they describe. Module names follow
# paths under `documenter/src`, e.g. `analysis.cfg.oracle.Cfg`. Add a glob for
# each top-level module folder that holds oracles.
name = "oracles"
defaultTargets = ["oracle"]

[[lean_lib]]
name = "Oracles"
srcDir = "documenter/src"
globs = ["analysis.+"]

# Answers queries from the Rust differential tests, one JSON object per line.
[[lean_exe]]
name = "oracle"
srcDir = "oracle_driver"
root = "Main"
